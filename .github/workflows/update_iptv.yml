name: Update my IPTV

on:
  schedule:
    - cron: '30 */6 * * *'   # 每6小时跑一次（UTC时间，约北京时间上午/下午/凌晨）
  workflow_dispatch:          # 允许手动触发

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        pip install -r requirements.txt
        sudo apt-get update
        sudo apt-get install -y ffmpeg

    - name: Crawl and verify
      run: python crawl_iptv.py

    - name: Commit results
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add -f my_list.m3u hd.txt report.txt
        git commit -m "chore(iptv): update available list [skip ci]" || echo "no changes"
        git push
